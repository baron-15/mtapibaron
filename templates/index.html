<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title> NYS DISPLAY </title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="styles.css">
        <link rel="manifest" href="manifest.json" />
    </head>
    <body>
        <div class="train">
            <div class="trainrow">
                <div class="num" id="num0">1.</div>    
                <div class="route" id="route0">
                    <div class="routeText" id="routeText0">.</div>
                </div>
                <div class="terminal" id="terminal0">.</div>
                <div class="eta" id="eta0">.</div>
            </div>
            <div class="trainrow">
                <div class="num" id="num1">2.</div>    
                <div class="route" id="route1">
                    <div class="routeText" id="routeText1">,</div>
                </div>
                <div class="terminal" id="terminal1">,</div>
                <div class="eta" id="eta1">,</div>
            </div>
        </div>
        <div class = "footer">
            <form action="" id="stopIdForm">
                <div>
                    <b>Enter your station's stop ID: </b>
                    <input type="text" id="stopIdEntry" placeholder="640 is Brooklyn Bridge">
                    <button type="submit">Submit</button>
                    <span>Use <b>parent_id</b> in <a href = "https://github.com/baron-15/MTAPI/blob/master/scripts/stations.csv"  target="_blank" rel="noopener noreferrer"> this csv</a></span>
                </div>
            </form>
            <div class="misc" id="datetime">Time is coming</div>
        </div>
        <script src="javascript.js"></script>
    </body>
</html>
